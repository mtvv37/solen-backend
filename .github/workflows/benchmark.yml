name: benchmark-crawl


# Crawls public product pages from tools/benchmark/seeds.txt every night,
# stores features on the branch "benchmark-data", and sends a ntfy summary.
# No secret needed. The ntfy topic below is public (this repository is public):
# it only carries crawl summaries.

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      batch:
        description: "Domains to crawl in this run"
        default: "2500"

permissions:
  contents: write

concurrency:
  group: benchmark
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch data branch
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          mkdir data && cd data
          git init -q
          git config user.name "solen-benchmark"
          git config user.email "benchmark@users.noreply.github.com"
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${REPO}.git"
          if git fetch -q origin benchmark-data; then
            git checkout -q -b benchmark-data FETCH_HEAD
          else
            git checkout -q --orphan benchmark-data
          fi

      - name: Discover new stores from public roundup articles
        continue-on-error: true
        run: python3 tools/benchmark/discover.py --data data

      - name: Discover from the Tranco popularity ranking (next slice)
        continue-on-error: true
        run: python3 tools/benchmark/discover_tranco.py --data data --per-run 2500 --max-queue 5000

      - name: Crawl
        run: python3 tools/benchmark/crawl.py --data data --batch "${{ inputs.batch || 2500 }}" --workers 20 --budget-min 38

      - name: Aggregate
        run: python3 tools/benchmark/aggregate.py --data data

      - name: Save data
        run: |
          cd data
          git add -A
          if git diff --cached --quiet; then echo "nothing new"; else
            git commit -q -m "benchmark data $(date -u +%F)"
            git push -q origin HEAD:benchmark-data
          fi

      - name: Notify (ntfy)
        if: always()
        env:
          NTFY_TOPIC: solen-jhh607v7l91uh7rti9gz
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ -z "$NTFY_TOPIC" ]; then echo "NTFY_TOPIC not set, skipping"; exit 0; fi
          if [ "$JOB_STATUS" = "success" ] && [ -f data/summary.json ]; then
            MSG=$(python3 -c "import json;s=json.load(open('data/summary.json'));print('This run: %d domains, %d pages. Total: %d stores, %d pages. Left: %d. Status: %s' % (s['domains_processed'],s['pages_ok'],s['total_domains_with_pages'],s['total_pages_ok'],s['seeds_left'],s['by_status']))")
            curl -s -H "Title: Solen benchmark" -H "Tags: bar_chart" -d "$MSG" "https://ntfy.sh/$NTFY_TOPIC" > /dev/null
          else
            curl -s -H "Title: Solen benchmark FAILED" -H "Priority: high" -H "Tags: warning" \
              -d "The nightly crawl failed. Open the Actions tab of the repository." "https://ntfy.sh/$NTFY_TOPIC" > /dev/null
          fi
