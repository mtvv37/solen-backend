<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Schémas « Without Solen / With Solen » pour l'intro du formulaire Tally. Noir sur blanc, dessiné à la main (rough.js + Caveat).
     Rendu : sketch.html#without ou #with, 1200 x 800. Les dépendances (rough.js, Caveat) sont passées par render_sketch.js. -->
<style>
  @font-face{font-family:'Caveat';font-weight:600;src:url(FONT_URL) format('woff2')}
  html,body{margin:0;background:#fff}
  #c{display:block;background:#FFFFFF}
  text{font-family:'Caveat',cursive;fill:#111;font-weight:600}
</style>
<script src="ROUGH_URL"></script>
</head>
<body>
<svg id="c" xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"></svg>
<script>
const svg = document.getElementById('c');
const rc = rough.svg(svg);
const INK = { stroke: '#111', strokeWidth: 2.6, roughness: 1.6, bowing: 1.4 };
const add = (n) => svg.appendChild(n);
let seed = 7;
const opt = (o = {}) => ({ ...INK, seed: seed++, ...o });

function text(x, y, lines, size = 40, anchor = 'middle', weight = 600, fill = '#111') {
  const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  t.setAttribute('x', x); t.setAttribute('y', y); t.setAttribute('text-anchor', anchor);
  t.setAttribute('font-size', size); t.setAttribute('font-weight', weight); t.style.fill = fill;
  [].concat(lines).forEach((l, i) => {
    const s = document.createElementNS('http://www.w3.org/2000/svg', 'tspan');
    s.setAttribute('x', x); s.setAttribute('dy', i === 0 ? 0 : size * 1.08); s.textContent = l; t.appendChild(s);
  });
  add(t); return t;
}
function box(x, y, w, h, lines, o = {}) {
  add(rc.rectangle(x, y, w, h, opt(o.dashed ? { strokeLineDash: [12, 10] } : {})));
  const size = o.size || 40, n = [].concat(lines).length;
  text(x + w / 2, y + h / 2 - ((n - 1) * size * 1.08) / 2 + size * 0.32, lines, size);
}
function head(x1, y1, x2, y2) {
  const a = Math.atan2(y2 - y1, x2 - x1), L = 20;
  add(rc.line(x2, y2, x2 - L * Math.cos(a - 0.45), y2 - L * Math.sin(a - 0.45), opt()));
  add(rc.line(x2, y2, x2 - L * Math.cos(a + 0.45), y2 - L * Math.sin(a + 0.45), opt()));
}
function arrow(x1, y1, x2, y2) { add(rc.line(x1, y1, x2, y2, opt())); head(x1, y1, x2, y2); }
function curve(points) {
  add(rc.curve(points, opt()));
  const [p, q] = points.slice(-2); head(p[0], p[1], q[0], q[1]);
}
function title(s) {
  text(60, 92, s, 72, 'start', 700);
  add(rc.line(60, 112, 60 + s.length * 27, 108, opt({ strokeWidth: 3 })));
}
function caption(s) { text(600, 772, s, 46); }
function stick(x, y, s = 1) {
  add(rc.circle(x, y, 26 * s, opt({ strokeWidth: 2.2 })));
  add(rc.line(x, y + 13 * s, x, y + 50 * s, opt({ strokeWidth: 2.2 })));
  add(rc.line(x, y + 26 * s, x - 18 * s, y + 38 * s, opt({ strokeWidth: 2.2 })));
  add(rc.line(x, y + 26 * s, x + 18 * s, y + 18 * s, opt({ strokeWidth: 2.2 })));
  add(rc.line(x, y + 50 * s, x - 14 * s, y + 74 * s, opt({ strokeWidth: 2.2 })));
  add(rc.line(x, y + 50 * s, x + 14 * s, y + 74 * s, opt({ strokeWidth: 2.2 })));
}
function check(x, y) { add(rc.linearPath([[x, y], [x + 14, y + 16], [x + 40, y - 18]], opt({ strokeWidth: 4 }))); }

function size(w, h) {
  svg.setAttribute('width', w); svg.setAttribute('height', h); svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
}
size(1200, 800);
// Grille : 2 rangées de 3 cases (310 x 180), la 2e se lit de droite à gauche.
const W = 310, H = 180, X = [60, 445, 830], Y1 = 150, Y2 = 470;

const scenes = {

  // Une seule image : Without Solen à gauche, With Solen à droite. Fond blanc, couleurs par côté.
  compare() {
    size(1400, 1100);
    const G = '#1F9D5C', GF = '#E3F8EC', R = '#D9483B', RF = '#FDE9E4', INKC = '#111';
    const col = (x0, color, fill, ttl, steps, cap, capColor) => {
      text(x0 + 300, 112, ttl, 78, 'middle', 700, color);
      add(rc.line(x0 + 300 - ttl.length * 15, 132, x0 + 300 + ttl.length * 15, 128, opt({ stroke: color, strokeWidth: 3.2 })));
      const bx = x0 + 70, bw = 460, bh = 140, ys = [190, 380, 570, 760];
      steps.forEach((st, k) => {
        const y = ys[k];
        add(rc.rectangle(bx, y, bw, bh, opt({ stroke: color, fill: st.dashed ? undefined : fill, fillStyle: 'solid',
          strokeLineDash: st.dashed ? [14, 10] : undefined, strokeWidth: 3 })));
        const n = st.lines.length, sz = st.size || 44;
        text(bx + bw / 2, y + bh / 2 - ((n - 1) * sz * 1.08) / 2 + sz * 0.32, st.lines, sz, 'middle', 600, INKC);
        if (st.tag) text(bx + bw - 6, y - 12, st.tag, 32, 'end', 700, color);
        if (k < 3) {
          add(rc.line(bx + bw / 2, y + bh + 6, bx + bw / 2, ys[k + 1] - 8, opt({ stroke: color, strokeWidth: 3 })));
          const tx = bx + bw / 2, ty = ys[k + 1] - 8;
          add(rc.line(tx, ty, tx - 14, ty - 18, opt({ stroke: color, strokeWidth: 3 })));
          add(rc.line(tx, ty, tx + 14, ty - 18, opt({ stroke: color, strokeWidth: 3 })));
        }
      });
      text(x0 + 300, 1010, cap, 54, 'middle', 700, capColor);
    };
    col(760, G, GF, 'With Solen', [
      { lines: ['Watches how', 'visitors behave'] },
      { lines: ['Spots where', 'they get stuck'] },
      { lines: ['Proposes a fix', '+ how sure it is'] },
      { lines: ['Above your threshold,', 'applies it itself'], dashed: true, size: 42, tag: 'coming next' },
    ], 'One clear next step.', G);
    col(40, R, RF, 'Without Solen', [
      { lines: ['Data everywhere:', 'Shopify, GA4, heatmaps'], size: 40 },
      { lines: ['You stare at it', 'and guess'] },
      { lines: ['You change', 'something'] },
      { lines: ['Did it work?', '???'] },
    ], 'Lots of data. No next step.', R);
    // Boucle « guess again » à droite de la colonne Without
    add(rc.curve([[105, 830], [60, 760], [55, 560], [100, 450]], opt({ stroke: R, strokeWidth: 3 })));
    add(rc.line(100, 450, 98, 474, opt({ stroke: R, strokeWidth: 3 })));
    add(rc.line(100, 450, 80, 464, opt({ stroke: R, strokeWidth: 3 })));
    const g = text(28, 640, 'guess again', 34, 'middle', 700, R); g.setAttribute('transform', 'rotate(-90 28 640)');
    // Séparation et « vs »
    add(rc.line(700, 70, 700, 470, opt({ stroke: '#B9BEC4', strokeWidth: 2, strokeLineDash: [10, 12] })));
    add(rc.line(700, 600, 700, 1040, opt({ stroke: '#B9BEC4', strokeWidth: 2, strokeLineDash: [10, 12] })));
    add(rc.circle(700, 535, 96, opt({ stroke: INKC, fill: '#FFFFFF', fillStyle: 'solid' })));
    text(700, 550, 'vs', 48, 'middle', 700, INKC);
  },
  without() {
    title('Without Solen');
    box(X[0], Y1, W, H, ['Visitors browse', 'your store']);
    box(X[1], Y1, W, H, ['Data everywhere', 'Shopify, GA4,', 'heatmaps...']);
    box(X[2], Y1, W, H, ['You stare at it', 'and guess']);
    box(X[2], Y2, W, H, ['You change', 'something', '"move the button?"'], { size: 38 });
    box(X[1], Y2, W, H, ['Did it work?', '???'], { size: 44 });
    arrow(X[0] + W + 8, Y1 + 90, X[1] - 8, Y1 + 90);
    arrow(X[1] + W + 8, Y1 + 90, X[2] - 8, Y1 + 90);
    arrow(X[2] + 155, Y1 + H + 8, X[2] + 155, Y2 - 8);
    arrow(X[2] - 8, Y2 + 90, X[1] + W + 8, Y2 + 90);
    curve([[X[1] + 70, Y2 - 8], [X[1] + 150, 405], [X[2] - 60, 385], [X[2] + 40, Y1 + H + 10]]);
    text(X[1] + 250, 440, 'guess again', 36);
    // Le marchand perdu, en bas à gauche
    stick(215, 505, 1.15);
    text(150, 515, '?', 54); text(285, 500, '?', 44); text(262, 560, '?', 36);
    text(215, 625, 'weeks later, still not sure', 32);
    caption('Lots of data. No clear next step.');
  },
  with() {
    title('With Solen');
    box(X[0], Y1, W, H, ['Visitors browse', 'your store']);
    box(X[1], Y1, W, H, ['Solen watches', 'how they behave']);
    box(X[2], Y1, W, H, ['Spots where', 'they get stuck']);
    box(X[2], Y2, W, H, ['Proposes a fix,', 'and how sure', 'it is (e.g. 82%)'], { size: 38 });
    box(X[1], Y2, W, H, ['Above your', 'threshold (say 80%),', 'ships it itself'], { dashed: true, size: 36 });
    box(X[0], Y2, W, H, ['Measures it,', 'rolls it back', 'if it hurts'], { dashed: true, size: 38 });
    arrow(X[0] + W + 8, Y1 + 90, X[1] - 8, Y1 + 90);
    arrow(X[1] + W + 8, Y1 + 90, X[2] - 8, Y1 + 90);
    arrow(X[2] + 155, Y1 + H + 8, X[2] + 155, Y2 - 8);
    arrow(X[2] - 8, Y2 + 90, X[1] + W + 8, Y2 + 90);
    arrow(X[1] - 8, Y2 + 90, X[0] + W + 8, Y2 + 90);
    curve([[X[0] + 150, Y2 - 8], [X[0] + 230, 405], [X[1] + 30, 385], [X[1] + 120, Y1 + H + 10]]);
    text(X[0] + 380, 458, 'learns for next time', 32);
    text(X[2] + 5, 380, ['e.g. "on mobile, most', 'visitors never scroll', 'down to Add to cart"'], 28, 'end');
    // Garde-fous, sous la 2e rangée
    text(X[2] + 155, 688, ['prices, promos, checkout:', 'always your call'], 28);
    text(X[1] + 155, 688, ['below the threshold,', 'it asks you first'], 28);
    text(X[0] + 155, 688, ['dashed = coming next'], 28);
    caption('AI proposes. Reality decides.');
  },
};
(scenes[location.hash.slice(1)] || scenes.without)();
</script>
</body>
</html>
