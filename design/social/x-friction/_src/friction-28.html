<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Visuel X, série « Shopify friction worth testing » #28. 1080 x 1350 (4:5).
     DA de la bannière X verte : fond sapin, fils verts lumineux, tuiles blanches à icônes, logo centré.
     Polices embarquées du kit Solen (Inter Tight, Archivo Expanded, JetBrains Mono). -->
<link rel="stylesheet" href="../../../video/vision-film/_src/fonts.css">
<style>
  :root{--bg:#040A06;--card:#07130C;--line:#183323;--bright:#2BD07A;--light:#7EF0A5;--text:#EEF5F0;--muted:#93AA9C;--warn:#FFB45B}
  *{box-sizing:border-box;margin:0;padding:0}
  body{width:1080px;height:1350px;background:var(--bg);overflow:hidden}
  #c{position:relative;width:1080px;height:1350px;font-family:'Inter Tight';color:var(--text);overflow:hidden;
     background:radial-gradient(ellipse 70% 42% at 50% 30%, #0C2416 0%, rgba(4,10,6,0) 72%),
                radial-gradient(ellipse 60% 30% at 50% 92%, rgba(12,36,22,.9) 0%, rgba(4,10,6,0) 70%), var(--bg)}
  svg.threads{position:absolute;inset:0}
  .mono{font-family:'JetBrains Mono';letter-spacing:.18em;text-transform:uppercase}

  /* Tuiles blanches comme sur la bannière */
  .tile{position:absolute;width:84px;height:84px;margin:-42px 0 0 -42px;border-radius:22px;display:flex;align-items:center;justify-content:center;
        background:linear-gradient(160deg,#FFFFFF,#DDEFE3);box-shadow:0 0 0 1px rgba(126,240,165,.55),0 0 38px rgba(43,208,122,.5)}
  .tile svg{width:36px;height:36px;fill:none;stroke:#0B1F14;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  .tile.ab{font-family:'JetBrains Mono';font-weight:600;font-size:23px;color:#0B1F14;letter-spacing:.02em}

  .brand{position:absolute;left:0;right:0;top:56px;display:flex;justify-content:center;align-items:center;gap:14px}
  .brand span{font-family:'Archivo';font-weight:800;font-stretch:125%;font-size:30px}
  .halo{position:absolute;left:250px;top:140px;width:580px;height:360px;background:radial-gradient(closest-side,rgba(4,10,6,.9),rgba(4,10,6,0))}
  .eyebrow{position:absolute;left:0;right:0;top:150px;text-align:center;font-size:22px;color:var(--light)}
  h1{position:absolute;left:0;right:0;top:196px;text-align:center;font-weight:800;font-size:116px;line-height:.96;letter-spacing:-.05em}
  h1 i{font-style:italic;background:linear-gradient(100deg,#9BF2C2,var(--bright));-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:8px}
  .sub{position:absolute;left:0;right:0;top:440px;text-align:center;font-size:30px;font-weight:500;color:var(--muted);letter-spacing:-.01em}

  .row{position:absolute;left:90px;right:90px;top:522px;display:grid;grid-template-columns:1fr 1fr;gap:34px}
  .card{background:rgba(7,19,12,.94);border:2px solid var(--line);border-radius:28px;padding:26px 28px 30px}
  .card.test{border-color:var(--bright);box-shadow:0 0 0 1px rgba(43,208,122,.15),0 24px 70px rgba(43,208,122,.16)}
  .tag{font-size:20px;color:var(--muted);margin-bottom:20px}
  .test .tag{color:var(--light)}
  .img{height:130px;border-radius:16px;background:linear-gradient(160deg,#0F2418,#0A1A11);border:1px solid var(--line);position:relative;overflow:hidden}
  .img::after{content:"";position:absolute;left:50%;top:50%;width:74px;height:92px;transform:translate(-50%,-44%);border-radius:26px 26px 12px 12px;
              background:linear-gradient(180deg,rgba(126,240,165,.2),rgba(126,240,165,.06))}
  .bar{height:14px;border-radius:7px;background:rgba(238,245,240,.16);margin-top:22px;width:80%}
  .bar.s{width:48%;margin-top:10px;background:rgba(238,245,240,.09)}
  .price{display:flex;align-items:center;gap:14px;margin-top:22px;height:62px;white-space:nowrap}
  .now{font-weight:800;font-size:54px;letter-spacing:-.03em}
  .was{font-weight:500;font-size:32px;color:var(--muted);text-decoration:line-through;text-decoration-thickness:3px}
  .save{font-family:'JetBrains Mono';font-weight:600;font-size:19px;letter-spacing:.06em;color:#04140A;background:var(--light);border-radius:999px;padding:8px 13px}
  .btn{margin-top:20px;height:66px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:25px;
       background:rgba(238,245,240,.10);color:rgba(238,245,240,.72)}
  .test .btn{background:var(--text);color:var(--bg)}

  .q{position:absolute;left:90px;right:90px;top:1012px;display:grid;grid-template-columns:1fr 1fr;gap:34px}
  .q div{border-top:2px solid var(--line);padding-top:20px;background:linear-gradient(180deg,rgba(4,10,6,.85),rgba(4,10,6,0))}
  .q b{display:block;font-size:19px;margin-bottom:10px;font-weight:400}
  .q p{font-size:29px;line-height:1.28;font-weight:500;letter-spacing:-.01em}
  .q .h b{color:var(--warn)} .q .m b{color:var(--light)}

  .foot{position:absolute;left:90px;right:90px;bottom:70px;display:flex;justify-content:space-between;align-items:center;font-family:'JetBrains Mono';font-size:24px}
  .foot .l{color:var(--muted)} .foot .r{color:var(--light)}
</style>
</head>
<body>
<div id="c">
  <svg class="threads" width="1080" height="1350" viewBox="0 0 1080 1350" aria-hidden="true">
    <defs>
      <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
        <feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>
    <g id="lines" fill="none" stroke="#2BD07A" stroke-width="2.2" stroke-linecap="round" filter="url(#glow)"></g>
  </svg>

  <div class="halo"></div>

  <!-- Tuiles : observer, prix, remise, test, panier -->
  <div class="tile" style="left:118px;top:250px"><svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></div>
  <div class="tile" style="left:196px;top:418px"><svg viewBox="0 0 24 24"><path d="M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0L2 12V2h10l8.6 8.6a2 2 0 0 1 0 2.8z"/><circle cx="7" cy="7" r="1.4"/></svg></div>
  <div class="tile" style="left:958px;top:232px"><svg viewBox="0 0 24 24"><line x1="19" y1="5" x2="5" y2="19"/><circle cx="6.5" cy="6.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/></svg></div>
  <div class="tile ab" style="left:888px;top:410px">A/B</div>
  <div class="tile" style="left:540px;top:1232px"><svg viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg></div>

  <div class="brand">
    <svg width="48" height="35" viewBox="0 0 65.47 48.00" aria-hidden="true"><g fill="#FFFFFF">
      <path d="M17.47 0.00 L55.47 0.00 L45.47 11.00 L13.47 11.00 Z"/><path d="M65.47 0.00 L51.64 38.00 L42.82 32.00 L54.47 0.00 Z"/>
      <path d="M48.00 48.00 L10.00 48.00 L20.00 37.00 L52.00 37.00 Z"/><path d="M0.00 48.00 L13.83 10.00 L22.65 16.00 L11.00 48.00 Z"/></g></svg>
    <span>Solen</span>
  </div>
  <div class="eyebrow mono">Shopify friction worth testing · #28</div>
  <h1>Is it even<br>a <i>deal</i>?</h1>
  <div class="sub">A sale price with nothing to compare it to.</div>

  <div class="row">
    <div class="card">
      <div class="tag mono">Today</div>
      <div class="img"></div><div class="bar"></div><div class="bar s"></div>
      <div class="price"><span class="now">€39</span></div>
      <div class="btn">Add to cart</div>
    </div>
    <div class="card test">
      <div class="tag mono">I'd test</div>
      <div class="img"></div><div class="bar"></div><div class="bar s"></div>
      <div class="price"><span class="now">€39</span><span class="was">€55</span><span class="save">SAVE €16</span></div>
      <div class="btn">Add to cart</div>
    </div>
  </div>

  <div class="q">
    <div class="h"><b class="mono">Hypothesis</b><p>Shoppers can't tell how good the deal is.</p></div>
    <div class="m"><b class="mono">Measure</b><p>Add-to-cart rate on sale items.</p></div>
  </div>

  <div class="foot"><span class="l">withsolen.com</span><span class="r">follow for more →</span></div>
</div>
<script>
  // Fils lumineux : courbes de Catmull-Rom qui passent par les tuiles, comme sur la bannière.
  const threads = [
    { o: .55, p: [[-80,150],[118,250],[330,300],[620,282],[958,232],[1160,160]] },
    // Les fils du milieu plongent derrière les cartes au lieu de traverser le sous-titre.
    { o: .45, p: [[-80,560],[196,418],[300,520],[340,660]] },
    { o: .45, p: [[1160,470],[888,410],[790,520],[740,660]] },
    { o: .35, p: [[-80,330],[118,250],[60,120],[200,-40]] },
    { o: .40, p: [[958,232],[888,410],[1010,620],[1160,700]] },
    { o: .50, p: [[-80,1120],[230,1200],[540,1232],[860,1200],[1160,1120]] },
  ];
  const path = (p) => {
    let d = `M${p[0][0]} ${p[0][1]}`;
    for (let i = 0; i < p.length - 1; i++) {
      const p0 = p[i - 1] || p[i], p1 = p[i], p2 = p[i + 1], p3 = p[i + 2] || p2;
      const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
      const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
      d += ` C${c1[0]} ${c1[1]} ${c2[0]} ${c2[1]} ${p2[0]} ${p2[1]}`;
    }
    return d;
  };
  const g = document.getElementById('lines');
  for (const t of threads) {
    const el = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    el.setAttribute('d', path(t.p)); el.setAttribute('stroke-opacity', t.o); g.appendChild(el);
  }
</script>
</body>
</html>
