<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Visuel X, série « Shopify friction worth testing » #28. 1200 x 675 (16:9), même format que le premier lot (brand/posts/).
     Même mise en page : téléphone annoté à gauche, texte à droite, logo en bas à gauche, compte en bas à droite.
     DA de la bannière X verte : fond sapin, fils verts lumineux, tuiles blanches à icônes. Polices du kit Solen. -->
<link rel="stylesheet" href="../../../video/vision-film/_src/fonts.css">
<style>
  :root{--bg:#040A06;--card:#07130C;--line:#183323;--bright:#2BD07A;--light:#7EF0A5;--text:#EEF5F0;--muted:#93AA9C}
  *{box-sizing:border-box;margin:0;padding:0}
  body{width:1200px;height:675px;background:var(--bg);overflow:hidden}
  #c{position:relative;width:1200px;height:675px;font-family:'Inter Tight';color:var(--text);overflow:hidden;
     background:radial-gradient(ellipse 45% 70% at 22% 50%, #0C2416 0%, rgba(4,10,6,0) 70%),
                radial-gradient(ellipse 50% 60% at 78% 45%, rgba(12,36,22,.7) 0%, rgba(4,10,6,0) 70%), var(--bg)}
  svg.threads{position:absolute;inset:0}
  .mono{font-family:'JetBrains Mono';letter-spacing:.18em;text-transform:uppercase}

  .tile{position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:17px;display:flex;align-items:center;justify-content:center;
        background:linear-gradient(160deg,#FFFFFF,#DDEFE3);box-shadow:0 0 0 1px rgba(126,240,165,.55),0 0 30px rgba(43,208,122,.5)}
  .tile svg{width:28px;height:28px;fill:none;stroke:#0B1F14;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

  /* Téléphone : même place que dans le premier lot */
  .phone{position:absolute;left:110px;top:45px;width:290px;height:502px;border-radius:44px;background:#0A1A11;border:4px solid #1E3A29;padding:14px;
         box-shadow:0 30px 80px rgba(0,0,0,.45),0 0 0 1px rgba(126,240,165,.08)}
  .screen{position:relative;width:100%;height:100%;border-radius:32px;background:var(--card);overflow:hidden;padding:16px}
  .nav{height:26px;border-radius:8px;background:rgba(238,245,240,.07)}
  .img{margin-top:12px;height:196px;border-radius:14px;background:linear-gradient(160deg,#12301F,#0B1E13);position:relative}
  .img::after{content:"";position:absolute;left:50%;top:50%;width:76px;height:100px;transform:translate(-50%,-44%);border-radius:28px 28px 12px 12px;
              background:linear-gradient(180deg,rgba(126,240,165,.22),rgba(126,240,165,.07))}
  .bar{height:12px;border-radius:6px;background:rgba(238,245,240,.16);margin-top:16px;width:76%}
  .bar.s{width:44%;margin-top:8px;background:rgba(238,245,240,.09)}
  .price{position:relative;margin-top:16px;height:50px;display:flex;align-items:center;padding-left:10px}
  .price span{font-weight:800;font-size:34px;letter-spacing:-.03em}
  .mark{position:absolute;left:0;top:0;width:118px;height:50px;border:3px solid var(--bright);border-radius:12px;box-shadow:0 0 18px rgba(43,208,122,.45)}
  .badge{position:absolute;left:104px;top:-14px;width:30px;height:30px;border-radius:50%;background:var(--bright);color:#04140A;
         font-family:'JetBrains Mono';font-weight:600;font-size:17px;display:flex;align-items:center;justify-content:center}
  .btn{margin-top:14px;height:46px;border-radius:12px;background:var(--text);color:var(--bg);font-weight:700;font-size:18px;display:flex;align-items:center;justify-content:center}
  .bar.t{margin-top:16px;width:84%;background:rgba(238,245,240,.08)}

  .copy{position:absolute;left:480px;right:70px;top:150px}
  .eyebrow{font-size:19px;color:var(--light)}
  h1{margin-top:22px;font-weight:800;font-size:60px;line-height:1.02;letter-spacing:-.045em}
  h1 i{font-style:italic;background:linear-gradient(100deg,#9BF2C2,var(--bright));-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:6px}
  .sub{margin-top:24px;font-size:25px;font-weight:500;color:var(--muted);letter-spacing:-.01em}
  .note{position:absolute;left:480px;top:494px;font-size:23px;font-weight:500;color:var(--muted)}

  .brand{position:absolute;left:76px;top:574px;display:flex;align-items:center;gap:12px}
  .brand span{font-family:'Archivo';font-weight:800;font-stretch:125%;font-size:25px}
  .handle{position:absolute;right:72px;top:582px;font-family:'JetBrains Mono';font-size:22px;color:var(--muted)}
</style>
</head>
<body>
<div id="c">
  <svg class="threads" width="1200" height="675" viewBox="0 0 1200 675" aria-hidden="true">
    <defs>
      <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
        <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>
    <g id="lines" fill="none" stroke="#2BD07A" stroke-width="2" stroke-linecap="round" filter="url(#glow)"></g>
  </svg>

  <!-- Tuiles : étiquette prix (en haut, entre téléphone et texte), % (à droite), panier (en bas) -->
  <div class="tile" style="left:452px;top:84px"><svg viewBox="0 0 24 24"><path d="M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0L2 12V2h10l8.6 8.6a2 2 0 0 1 0 2.8z"/><circle cx="7" cy="7" r="1.4"/></svg></div>
  <div class="tile" style="left:1128px;top:96px"><svg viewBox="0 0 24 24"><line x1="19" y1="5" x2="5" y2="19"/><circle cx="6.5" cy="6.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/></svg></div>
  <div class="tile" style="left:1010px;top:470px"><svg viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg></div>

  <div class="phone"><div class="screen">
    <div class="nav"></div>
    <div class="img"></div>
    <div class="bar"></div><div class="bar s"></div>
    <div class="price"><span>€39</span><div class="mark"></div><div class="badge">1</div></div>
    <div class="btn">Add to cart</div>
    <div class="bar t"></div>
  </div></div>

  <div class="copy">
    <div class="eyebrow mono">Shopify friction worth testing · #28</div>
    <h1>Sale price <i>alone</i>?<br>I'd test the original<br>price next to it.</h1>
    <div class="sub">Hypothesis, not a result.</div>
  </div>
  <div class="note">Wireframe, not a real store.</div>

  <div class="brand">
    <svg width="40" height="29" viewBox="0 0 65.47 48.00" aria-hidden="true"><g fill="#FFFFFF">
      <path d="M17.47 0.00 L55.47 0.00 L45.47 11.00 L13.47 11.00 Z"/><path d="M65.47 0.00 L51.64 38.00 L42.82 32.00 L54.47 0.00 Z"/>
      <path d="M48.00 48.00 L10.00 48.00 L20.00 37.00 L52.00 37.00 Z"/><path d="M0.00 48.00 L13.83 10.00 L22.65 16.00 L11.00 48.00 Z"/></g></svg>
    <span>Solen</span>
  </div>
  <div class="handle">@thomzzss_</div>
</div>
<script>
  // Fils lumineux (courbes de Catmull-Rom) qui passent par les tuiles et derrière le téléphone, jamais sur le texte.
  const threads = [
    { o: .50, p: [[-60,120],[160,90],[452,84],[700,40],[900,-40]] },
    { o: .45, p: [[1260,40],[1128,96],[1080,250],[1150,420],[1260,520]] },
    { o: .50, p: [[-60,660],[300,610],[700,560],[1010,470],[1260,330]] },
    { o: .30, p: [[-60,300],[60,380],[250,330]] },
  ];
  const path = (p) => {
    let d = `M${p[0][0]} ${p[0][1]}`;
    for (let i = 0; i < p.length - 1; i++) {
      const p0 = p[i - 1] || p[i], p1 = p[i], p2 = p[i + 1], p3 = p[i + 2] || p2;
      d += ` C${p1[0] + (p2[0] - p0[0]) / 6} ${p1[1] + (p2[1] - p0[1]) / 6} ${p2[0] - (p3[0] - p1[0]) / 6} ${p2[1] - (p3[1] - p1[1]) / 6} ${p2[0]} ${p2[1]}`;
    }
    return d;
  };
  const g = document.getElementById('lines');
  for (const t of threads) {
    const el = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    el.setAttribute('d', path(t.p)); el.setAttribute('stroke-opacity', t.o); g.appendChild(el);
  }
</script>
</body>
</html>
